<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Base Destroyer UHD</title>
    <style>
        body { 
            margin: 0; background: #000; overflow: hidden; 
            font-family: 'Segoe UI', sans-serif; touch-action: none;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* ปุ่มควบคุมแบบโปร่งแสง ซ้อนบนหน้าจอ */
        .touch-zone {
            position: absolute; bottom: 30px; width: 100%;
            display: flex; justify-content: space-between; padding: 0 40px;
            box-sizing: border-box; pointer-events: none; z-index: 10;
        }
        .btn {
            width: 85px; height: 85px; background: rgba(255,255,255,0.1);
            border: 2px solid rgba(0, 204, 255, 0.5); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 18px; font-weight: bold;
            pointer-events: auto; user-select: none; -webkit-user-select: none;
            backdrop-filter: blur(5px);
        }
        .btn:active { background: rgba(0, 204, 255, 0.3); transform: scale(0.9); border-color: #fff; }
        .btn-ult { border-color: #ff00ff; color: #ff00ff; box-shadow: 0 0 15px rgba(255,0,255,0.3); }

        #overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; backdrop-filter: blur(10px);
        }
        .ui-text { position: absolute; top: 20px; color: #0ff; font-weight: bold; pointer-events: none; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 style="color:#0ff; letter-spacing: 5px; text-shadow: 0 0 20px #0ff;">ULTRA HD DEPLOY</h1>
        <button id="start-btn" style="padding: 15px 40px; font-size: 20px; background:#0ff; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">START MISSION</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="touch-zone">
        <div style="display:flex; gap:20px;">
            <div class="btn" id="left">⬅️</div>
            <div class="btn" id="right">➡️</div>
        </div>
        <div style="display:flex; gap:20px;">
            <div class="btn btn-ult" id="ult">ULT</div>
            <div class="btn" id="fire">🔥</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // --- UHD SCALING ENGINE ---
        function setupCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr); // ทำให้วาดภาพในหน่วยพิกเซลจริงของหน้าจอ
        }
        window.addEventListener('resize', setupCanvas);
        setupCanvas();

        let gameActive = false;
        let p, ai, pBase, aiBase;
        let bullets = [], particles = [], stars = [];
        let inputs = { left: false, right: false, fire: false, ult: false };
        let ultCharge = 0, ultActive = 0, shake = 0;

        function resetGame() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            pBase = { x: 50, y: h-200, w: 100, hp: 200, max: 200, color: '#0cf' };
            aiBase = { x: w-150, y: h-200, w: 100, hp: 400, max: 400, color: '#f44' };
            p = { x: 200, y: h-110, speed: 7, color: '#0cf', cd: 0 };
            ai = { x: w-250, y: h-110, speed: 4, color: '#f44', cd: 0 };
            bullets = []; particles = []; ultCharge = 0;
            stars = Array.from({length: 100}, () => ({x: Math.random()*w, y: Math.random()*h, s: Math.random()*2}));
        }

        // --- MOBILE INPUTS ---
        const bind = (id, key) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); inputs[key] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); inputs[key] = false; });
        };
        ['left', 'right', 'fire', 'ult'].forEach(k => bind(k, k));

        // Keyboard support
        window.onkeydown = (e) => {
            if(e.code === 'KeyA') inputs.left = true;
            if(e.code === 'KeyD') inputs.right = true;
            if(e.code === 'Space') inputs.fire = true;
            if(e.code === 'ShiftLeft') inputs.ult = true;
        };
        window.onkeyup = (e) => {
            if(e.code === 'KeyA') inputs.left = false;
            if(e.code === 'KeyD') inputs.right = false;
            if(e.code === 'Space') inputs.fire = false;
            if(e.code === 'ShiftLeft') inputs.ult = false;
        };

        document.getElementById('start-btn').onclick = () => {
            document.getElementById('overlay').style.display = 'none';
            resetGame(); gameActive = true; loop();
        };

        function update() {
            if (shake > 0) shake *= 0.9;
            if (inputs.left && p.x > 100) p.x -= p.speed;
            if (inputs.right && p.x < window.innerWidth - 200) p.x += p.speed;
            
            if (inputs.fire && p.cd <= 0) {
                bullets.push({x: p.x+40, y: p.y, vx: 15, owner: 'p', color: '#0ff'});
                p.cd = 15;
            }
            p.cd--;

            if (inputs.ult && ultCharge >= 100) { ultActive = 60; ultCharge = 0; shake = 20; }
            if (ultCharge < 100) ultCharge += 0.2;

            // AI Logic
            if(ai.x > p.x + 300) ai.x -= ai.speed; else ai.x += ai.speed;
            if(ai.cd <= 0) {
                bullets.push({x: ai.x, y: ai.y, vx: -10, owner: 'ai', color: '#f44'});
                ai.cd = 50;
            }
            ai.cd--;

            bullets.forEach((b, i) => {
                b.x += b.vx;
                if (b.owner === 'p' && b.x > aiBase.x) {
                    aiBase.hp -= 10; bullets.splice(i, 1);
                    for(let j=0; j<5; j++) particles.push({x:b.x, y:b.y, vx:Math.random()*5, vy:Math.random()*5-2.5, life:1, c:'#f44'});
                } else if (b.owner === 'ai' && b.x < pBase.x + pBase.w) {
                    pBase.hp -= 10; bullets.splice(i, 1); shake = 5;
                    for(let j=0; j<5; j++) particles.push({x:b.x, y:b.y, vx:-Math.random()*5, vy:Math.random()*5-2.5, life:1, c:'#0cf'});
                } else if (b.x < 0 || b.x > window.innerWidth) bullets.splice(i, 1);
            });

            if(ultActive > 0) { ultActive--; aiBase.hp -= 1.5; shake = 2; }

            particles.forEach((pt, i) => {
                pt.x += pt.vx; pt.y += pt.vy; pt.life -= 0.05;
                if(pt.life <= 0) particles.splice(i, 1);
            });

            if (pBase.hp <= 0 || aiBase.hp <= 0) gameActive = false;
        }

        function draw() {
            ctx.save();
            if(shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
            
            ctx.fillStyle = '#000'; ctx.fillRect(0,0, window.innerWidth, window.innerHeight);
            
            // ดาว (Sharp)
            ctx.fillStyle = '#fff';
            stars.forEach(s => ctx.fillRect(s.x, s.y, s.s, s.s));

            // พื้น (Neon Grid style)
            ctx.strokeStyle = '#111';
            for(let i=0; i<window.innerWidth; i+=50) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, window.innerHeight); ctx.stroke(); }
            
            const floorY = window.innerHeight - 80;
            ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, floorY, window.innerWidth, 80);
            ctx.fillStyle = '#0cf'; ctx.fillRect(0, floorY, window.innerWidth, 2);

            // Bases (UHD Glow)
            [pBase, aiBase].forEach(b => {
                ctx.shadowBlur = 20; ctx.shadowColor = b.color;
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.w, 120);
                ctx.shadowBlur = 0;
                // HP Bar
                ctx.fillStyle = '#222'; ctx.fillRect(b.x, b.y-20, b.w, 8);
                ctx.fillStyle = b.hp > b.max*0.3 ? '#0f0' : '#f00';
                ctx.fillRect(b.x, b.y-20, (b.hp/b.max)*b.w, 8);
            });

            // Tanks
            ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 50, 25);
            ctx.fillStyle = ai.color; ctx.fillRect(ai.x, ai.y, 50, 25);

            // Ultimate Beam
            if (ultActive > 0) {
                let g = ctx.createLinearGradient(p.x+50, 0, window.innerWidth, 0);
                g.addColorStop(0, '#fff'); g.addColorStop(0.2, '#ff00ff'); g.addColorStop(1, 'transparent');
                ctx.fillStyle = g; ctx.fillRect(p.x+50, p.y-5, window.innerWidth, 35);
            }

            // Bullets (Neon)
            bullets.forEach(b => {
                ctx.shadowBlur = 10; ctx.shadowColor = b.color;
                ctx.fillStyle = b.color;
                ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Particles
            particles.forEach(pt => {
                ctx.globalAlpha = pt.life; ctx.fillStyle = pt.c;
                ctx.fillRect(pt.x, pt.y, 3, 3);
            });
            ctx.globalAlpha = 1;

            // UI
            ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset scale for static UI
            const dpr = window.devicePixelRatio || 1;
            ctx.scale(dpr, dpr);
            
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(20, 20, 200, 30);
            ctx.fillStyle = ultCharge >= 100 ? '#f0f' : '#0cf';
            ctx.fillRect(25, 25, (ultCharge/100)*190, 20);
            ctx.fillStyle = '#fff'; ctx.font = "bold 14px Arial";
            ctx.fillText("ULTIMATE READY", 65, 40);

            ctx.restore();

            if(!gameActive && pBase) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,0,window.innerWidth, window.innerHeight);
                ctx.fillStyle = '#fff'; ctx.font = "bold 40px Arial"; ctx.textAlign="center";
                ctx.fillText(pBase.hp <= 0 ? "GAME OVER" : "VICTORY", window.innerWidth/2, window.innerHeight/2);
            }
        }

        function loop() { if(gameActive) update(); draw(); requestAnimationFrame(loop); }
    </script>
</body>
</html>
