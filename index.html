<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Base Destroyer: UHD Models</title>
    <style>
        body { margin: 0; background: #020205; overflow: hidden; font-family: 'Courier New', Courier, monospace; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.2)); }
        
        .ui-panel {
            position: absolute; bottom: 30px; width: 100%;
            display: flex; justify-content: space-between; padding: 0 30px;
            box-sizing: border-box; z-index: 100;
        }
        .btn {
            width: 70px; height: 70px; background: rgba(0, 20, 40, 0.7);
            border: 2px solid #0ff; border-radius: 12px;
            color: #0ff; font-size: 20px; display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(5px); user-select: none; -webkit-tap-highlight-color: transparent;
        }
        .btn:active { background: #0ff; color: #000; transform: scale(0.9); }
        .btn-ult { border-color: #f0f; color: #f0f; }

        #start-screen {
            position: absolute; inset: 0; background: radial-gradient(circle, #05101a 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 500; text-align: center;
        }
        h1 { color: #0ff; text-shadow: 0 0 20px #0ff; font-size: 3rem; margin: 0; letter-spacing: 10px; }
        button { margin-top: 30px; padding: 15px 50px; background: none; border: 2px solid #0ff; color: #0ff; font-weight: bold; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>BATTLE TANK</h1>
        <p style="color: #444;">ULTRA HIGH DEFINITION MODELS</p>
        <button onclick="startGame()">INITIATE SYSTEM</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="ui-panel">
        <div style="display:flex; gap:15px;">
            <div class="btn" id="btn-L">⬅️</div>
            <div class="btn" id="btn-R">➡️</div>
        </div>
        <div style="display:flex; gap:15px;">
            <div class="btn btn-ult" id="btn-U">ULT</div>
            <div class="btn" id="btn-F">🔥</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 2;
        let w, h;

        function resize() {
            w = window.innerWidth;
            h = window.innerHeight;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            ctx.scale(dpr, dpr);
        }
        window.onresize = resize;
        resize();

        let gameActive = false;
        let player, ai, pBase, aiBase;
        let bullets = [], particles = [], stars = [];
        let keys = { left: false, right: false, fire: false, ult: false };
        let ultProgress = 0, ultActive = 0;

        // --- MODEL DRAWING FUNCTIONS ---
        function drawTankModel(t, color, isPlayer) {
            ctx.save();
            ctx.translate(t.x, t.y);
            if (!isPlayer) ctx.scale(-1, 1); // หันหน้าไปทางซ้ายสำหรับ AI

            const recoil = t.recoil || 0;

            // 1. Treads (ตีนตะขาบ)
            ctx.fillStyle = '#111';
            ctx.fillRect(-25, 10, 50, 15);
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.strokeRect(-25, 10, 50, 15);

            // 2. Body (ตัวรถ)
            let grad = ctx.createLinearGradient(0, -10, 0, 10);
            grad.addColorStop(0, color);
            grad.addColorStop(1, '#000');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(-30, 10); ctx.lineTo(25, 10); ctx.lineTo(15, -10); ctx.lineTo(-25, -10);
            ctx.closePath(); ctx.fill();
            ctx.stroke();

            // 3. Turret (ป้อมปืน)
            ctx.beginPath();
            ctx.arc(-5, -12, 12, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            // 4. Barrel (ลำกล้องปืนพร้อมแรงถอย)
            ctx.fillStyle = '#333';
            ctx.fillRect(5 - recoil, -15, 30, 6);
            ctx.strokeStyle = color;
            ctx.strokeRect(5 - recoil, -15, 30, 6);
            
            ctx.restore();
            if (t.recoil > 0) t.recoil *= 0.8;
        }

        function drawBaseModel(b, color) {
            ctx.save();
            ctx.translate(b.x, b.y);
            // โครงสร้างฐานแบบ Cyber Tower
            ctx.fillStyle = 'rgba(0, 50, 100, 0.2)';
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 150); ctx.lineTo(b.w, 150); ctx.lineTo(b.w-20, 0); ctx.lineTo(20, 0);
            ctx.closePath(); ctx.fill(); ctx.stroke();

            // Core Energy
            let pulse = Math.sin(Date.now() / 200) * 10;
            ctx.shadowBlur = 15 + pulse;
            ctx.shadowColor = color;
            ctx.fillStyle = color;
            ctx.fillRect(b.w/2 - 10, 40, 20, 60);

            // HP Bar (Modern Style)
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#111';
            ctx.fillRect(0, -20, b.w, 6);
            ctx.fillStyle = b.hp > 100 ? color : '#f00';
            ctx.fillRect(0, -20, (b.hp / b.maxHp) * b.w, 6);
            ctx.restore();
        }

        // --- ENGINE ---
        function reset() {
            pBase = { x: 40, y: h-230, w: 100, hp: 200, maxHp: 200 };
            aiBase = { x: w-140, y: h-230, w: 100, hp: 400, maxHp: 400 };
            player = { x: 200, y: h-100, speed: 6, recoil: 0 };
            ai = { x: w-200, y: h-100, speed: 3, cd: 0, recoil: 0 };
            bullets = []; particles = [];
            stars = Array.from({length: 80}, () => ({x: Math.random()*w, y: Math.random()*h, s: Math.random()*1.5}));
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            reset(); gameActive = true; loop();
        }

        // --- INPUTS ---
        const setupBtn = (id, key) => {
            const el = document.getElementById(id);
            el.ontouchstart = (e) => { e.preventDefault(); keys[key] = true; };
            el.ontouchend = (e) => { e.preventDefault(); keys[key] = false; };
        };
        setupBtn('btn-L', 'left'); setupBtn('btn-R', 'right');
        setupBtn('btn-F', 'fire'); setupBtn('btn-U', 'ult');

        function update() {
            if (keys.left && player.x > 150) player.x -= player.speed;
            if (keys.right && player.x < w - 250) player.x += player.speed;
            if (keys.fire && (!player.cd || player.cd <= 0)) {
                bullets.push({x: player.x+30, y: player.y-12, vx: 18, owner:'p', color:'#0ff'});
                player.cd = 15; player.recoil = 10;
            }
            if (player.cd > 0) player.cd--;
            if (ultProgress < 100) ultProgress += 0.1;

            if (keys.ult && ultProgress >= 100) { ultActive = 60; ultProgress = 0; }

            // AI Model Logic
            if (ai.x > player.x + 350) ai.x -= ai.speed; else ai.x += ai.speed;
            if (ai.cd <= 0) {
                bullets.push({x: ai.x-30, y: ai.y-12, vx: -12, owner:'ai', color:'#f44'});
                ai.cd = 60; ai.recoil = 10;
            }
            ai.cd--;

            bullets.forEach((b, i) => {
                b.x += b.vx;
                if (b.owner === 'p' && b.x > aiBase.x) {
                    aiBase.hp -= 10; bullets.splice(i, 1);
                    for(let j=0; j<8; j++) particles.push({x:b.x, y:b.y, vx:Math.random()*4, vy:Math.random()*4-2, life:1, c:'#f44'});
                } else if (b.owner === 'ai' && b.x < pBase.x + pBase.w) {
                    pBase.hp -= 10; bullets.splice(i, 1);
                    for(let j=0; j<8; j++) particles.push({x:b.x, y:b.y, vx:-Math.random()*4, vy:Math.random()*4-2, life:1, c:'#0ff'});
                } else if (b.x < 0 || b.x > w) bullets.splice(i, 1);
            });

            if (ultActive > 0) { ultActive--; aiBase.hp -= 1.5; }
            particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.life -= 0.04; if(p.life <= 0) particles.splice(i, 1); });

            if (pBase.hp <= 0 || aiBase.hp <= 0) gameActive = false;
        }

        function draw() {
            ctx.fillStyle = '#020205'; ctx.fillRect(0, 0, w, h);
            
            // Stars
            ctx.fillStyle = '#fff';
            stars.forEach(s => ctx.fillRect(s.x, s.y, s.s, s.s));

            // Floor
            ctx.strokeStyle = '#051525';
            for(let i=0; i<w; i+=50) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, h); ctx.stroke(); }
            ctx.fillStyle = '#000810'; ctx.fillRect(0, h-80, w, 80);
            ctx.fillStyle = '#0ff'; ctx.fillRect(0, h-80, w, 2);

            // Draw Models
            drawBaseModel(pBase, '#0ff');
            drawBaseModel(aiBase, '#f44');
            drawTankModel(player, '#0ff', true);
            drawTankModel(ai, '#f44', false);

            // Ultimate Beam
            if (ultActive > 0) {
                let g = ctx.createLinearGradient(player.x+30, 0, w, 0);
                g.addColorStop(0, '#fff'); g.addColorStop(0.2, '#f0f'); g.addColorStop(1, 'transparent');
                ctx.fillStyle = g; ctx.fillRect(player.x+30, player.y-25, w, 30);
            }

            // Projectiles
            bullets.forEach(b => {
                ctx.shadowBlur = 10; ctx.shadowColor = b.color;
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = b.color; ctx.stroke();
            });

            // Particles
            ctx.shadowBlur = 0;
            particles.forEach(p => {
                ctx.globalAlpha = p.life; ctx.fillStyle = p.c;
                ctx.fillRect(p.x, p.y, 3, 3);
            });
            ctx.globalAlpha = 1;

            // HUD
            ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(20, 20, 160, 20);
            ctx.fillStyle = ultProgress >= 100 ? '#f0f' : '#0ff';
            ctx.fillRect(20, 20, (ultProgress/100)*160, 20);
        }

        function loop() {
            if (gameActive) update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
