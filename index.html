<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Base Destroyer: ULTIMATE</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: #050505; 
            color: #fff; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }
        canvas { 
            border: 4px solid #333; 
            background: radial-gradient(circle at center, #1a2a3a 0%, #000000 100%); 
            box-shadow: 0 0 60px rgba(0, 200, 255, 0.1);
            border-radius: 8px;
            max-width: 95vw;
            max-height: 70vh;
        }
        #overlay {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #00ccff;
            text-align: center;
            z-index: 100;
        }
        h1 { margin: 0 0 20px; font-size: 32px; color: #00ccff; text-shadow: 0 0 10px #00ccff; text-transform: uppercase; }
        
        /* ปุ่มควบคุมมือถือ */
        #mobile-ui {
            display: none;
            width: 100%;
            padding: 10px;
            justify-content: space-between;
            position: fixed;
            bottom: 20px;
        }
        .control-group { display: flex; gap: 10px; margin: 0 20px; }
        .btn {
            width: 65px; height: 65px; background: rgba(255,255,255,0.1);
            border: 2px solid #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 14px; color: #fff;
        }
        .btn:active { background: rgba(0, 204, 255, 0.4); transform: scale(0.9); }
        .btn-ult { border-color: #ff00ff; color: #ff00ff; }

        .boss-mode-text {
            position: absolute; top: 15%; left: 50%; transform: translateX(-50%);
            color: #ff0000; font-size: 40px; font-weight: 900; display: none;
            text-shadow: 0 0 20px red; pointer-events: none;
        }
        
        @media (max-width: 900px) { #mobile-ui { display: flex; } }
    </style>
</head>
<body>

    <div style="position: relative;">
        <canvas id="gameCanvas" width="900" height="500"></canvas>
        <div id="boss-alert" class="boss-mode-text">⚠️ BOSS DETECTED ⚠️</div>
        <div id="overlay">
            <h1>Mission Start</h1>
            <button id="start-btn" style="padding: 15px 40px; font-size: 20px; cursor: pointer; background: #00ccff; border: none; font-weight: bold; border-radius: 5px;">DEPLOY</button>
            <p style="color: #888; margin-top: 15px;">PC: A,D, SPACE, SHIFT | Mobile: UI Buttons</p>
        </div>
    </div>

    <div id="mobile-ui">
        <div class="control-group">
            <div class="btn" id="btn-left">L</div>
            <div class="btn" id="btn-right">R</div>
        </div>
        <div class="control-group">
            <div class="btn btn-ult" id="btn-ult">ULT</div>
            <div class="btn" id="btn-fire">FIRE</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const bossAlert = document.getElementById('boss-alert');

        let audioCtx, musicInterval;
        let gameActive = false;
        let player, ai, playerBase, aiBase;
        let bullets = [], particles = [], stars = [];
        let shake = 0;
        let ultCharge = 0; // 0 to 100
        let ultActive = 0; // Duration
        let isBossMode = false;
        let keys = {};

        // --- AUDIO ---
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            startMusic();
        }
        function playTone(freq, type, duration, vol=0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }
        function startMusic() {
            if (musicInterval) clearInterval(musicInterval);
            let n = 0; const melody = [110, 110, 123, 110, 98, 110, 87, 98]; 
            musicInterval = setInterval(() => {
                if(!gameActive) return;
                playTone(isBossMode ? melody[n%8]*0.8 : melody[n%8], 'triangle', 0.2, 0.05);
                n++;
            }, 200);
        }

        // --- GRAPHICS ---
        function drawTank(t) {
            ctx.save();
            ctx.translate(t.x, t.y);
            ctx.fillStyle = '#222'; ctx.fillRect(0, 15, 45, 10); // Treads
            ctx.fillStyle = t.color;
            ctx.beginPath();
            if(t.isBoss) { ctx.moveTo(0,15); ctx.lineTo(10,0); ctx.lineTo(35,0); ctx.lineTo(45,15); }
            else { ctx.moveTo(5,15); ctx.lineTo(10,5); ctx.lineTo(35,5); ctx.lineTo(40,15); }
            ctx.fill();
            ctx.fillStyle = t.isBoss ? '#f00' : '#eee'; ctx.fillRect(15, -5, 15, 12);
            ctx.fillStyle = '#888'; 
            if(t.type==='p') ctx.fillRect(25, -2, 25, 6); else ctx.fillRect(-5, -2, 25, 6);
            ctx.restore();
        }

        function drawBase(b, isP) {
            ctx.save(); ctx.translate(b.x, b.y);
            ctx.fillStyle = b.color; ctx.shadowBlur = 15; ctx.shadowColor = b.color;
            ctx.fillRect(10, 20, b.w-20, 60);
            ctx.fillStyle = '#000'; ctx.fillRect(0, -45, b.w, 8);
            ctx.fillStyle = b.hp > b.maxHp*0.3 ? '#0f0' : '#f00';
            ctx.fillRect(0, -45, (b.hp/b.maxHp)*b.w, 8);
            ctx.restore();
        }

        // --- CORE LOGIC ---
        document.getElementById('start-btn').onclick = () => {
            initAudio(); overlay.style.display = 'none'; resetGame(); gameActive = true; loop();
        };

        function resetGame() {
            playerBase = { x: 50, y: 350, w: 80, h: 100, hp: 200, maxHp: 200, color: '#00ccff' };
            aiBase = { x: 770, y: 350, w: 80, h: 100, hp: 400, maxHp: 400, color: '#ff4444' };
            player = { x: 150, y: 435, speed: 5, color: '#00ccff', type: 'p', cooldown: 0 };
            ai = { x: 700, y: 435, speed: 3.5, color: '#ff4444', type: 'ai', cooldown: 0, isBoss: false };
            bullets = []; particles = []; ultCharge = 0; ultActive = 0; isBossMode = false;
            stars = []; for(let i=0; i<80; i++) stars.push({x: Math.random()*900, y: Math.random()*500, s: Math.random()*2});
        }

        function spawnParticle(x, y, color) {
            for(let i=0; i<8; i++) particles.push({ x, y, vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8, life:1, color, size:Math.random()*3 });
        }

        function update() {
            if (shake > 0) shake *= 0.8;

            // Boss Mode Trigger
            if (!isBossMode && aiBase.hp < 200) {
                isBossMode = true; ai.isBoss = true; ai.color = '#fff'; ai.speed = 5;
                bossAlert.style.display = 'block'; setTimeout(() => bossAlert.style.display = 'none', 3000);
                playTone(50, 'square', 1); shake = 20;
            }

            // Controls
            if ((keys['KeyA'] || keys['left']) && player.x > 150) player.x -= player.speed;
            if ((keys['KeyD'] || keys['right']) && player.x < 750) player.x += player.speed;
            if ((keys['Space'] || keys['fire']) && player.cooldown <= 0) {
                bullets.push({x: player.x+40, y: player.y, vx: 12, owner: 'p', color: '#0ff'});
                player.cooldown = 20; playTone(400, 'square', 0.1, 0.05);
            }
            if ((keys['ShiftLeft'] || keys['ult']) && ultCharge >= 100) {
                ultActive = 60; ultCharge = 0; shake = 15; playTone(100, 'sawtooth', 1, 0.2);
            }
            if (player.cooldown > 0) player.cooldown--;
            if (ultCharge < 100) ultCharge += 0.05;

            // AI Logic
            if(ai.x > player.x + 200) ai.x -= ai.speed;
            else if(ai.x < player.x + 100) ai.x += ai.speed;
            if(ai.cooldown <= 0) {
                bullets.push({x: ai.x, y: ai.y, vx: -10, owner: 'ai', color: '#f00'});
                ai.cooldown = isBossMode ? 35 : 70;
            }
            ai.cooldown--;

            // Bullets & Beam
            if (ultActive > 0) {
                ultActive--; aiBase.hp -= 0.5; if(Math.abs(ai.x - player.x) < 900) ai.x += 2;
                spawnParticle(player.x+500, player.y, '#ff00ff');
            }

            bullets.forEach((b, i) => {
                b.x += b.vx;
                if (b.owner === 'p' && b.x > aiBase.x) {
                    aiBase.hp -= 10; spawnParticle(b.x, b.y, '#f00'); bullets.splice(i, 1);
                } else if (b.owner === 'ai' && b.x < playerBase.x + playerBase.w) {
                    playerBase.hp -= 10; spawnParticle(b.x, b.y, '#0ff'); bullets.splice(i, 1); shake = 5;
                } else if (b.x < 0 || b.x > 900) bullets.splice(i, 1);
            });

            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life -= 0.03; if (p.life <= 0) particles.splice(i, 1);
            });

            if (playerBase.hp <= 0 || aiBase.hp <= 0) gameActive = false;
        }

        function draw() {
            ctx.save(); if(shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
            ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, 900, 500);
            ctx.fillStyle = '#fff'; stars.forEach(s => ctx.fillRect(s.x, s.y, s.s, s.s));
            ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0, 460, 900, 40);

            drawBase(playerBase, true); drawBase(aiBase, false);
            drawTank(player); drawTank(ai);

            // Draw Beam
            if (ultActive > 0) {
                let grad = ctx.createLinearGradient(player.x+40, 0, 900, 0);
                grad.addColorStop(0, 'rgba(255, 0, 255, 0.8)'); grad.addColorStop(1, 'rgba(0, 255, 255, 0)');
                ctx.fillStyle = grad; ctx.fillRect(player.x+40, player.y-10, 900, 30);
                ctx.fillStyle = '#fff'; ctx.fillRect(player.x+40, player.y, 900, 10);
            }

            // Draw Bullets
            bullets.forEach(b => {
                ctx.fillStyle = b.color; ctx.shadowBlur = 10; ctx.shadowColor = b.color;
                ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill();
            });

            // Ultimate Gauge UI
            ctx.setTransform(1,0,0,1,0,0);
            ctx.fillStyle = '#333'; ctx.fillRect(20, 20, 200, 10);
            ctx.fillStyle = ultCharge >= 100 ? '#ff00ff' : '#00ccff';
            ctx.fillRect(20, 20, ultCharge*2, 10);
            ctx.font = "12px Arial"; ctx.fillText("ULTIMATE BEAM", 20, 45);

            ctx.restore();

            if (!gameActive) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,0,900,500);
                ctx.fillStyle = '#fff'; ctx.font = "40px Arial"; ctx.textAlign="center";
                ctx.fillText(playerBase.hp <= 0 ? "MISSION FAILED" : "MISSION ACCOMPLISHED", 450, 250);
            }
        }

        // --- CONTROLS BINDING ---
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;

        const setupBtn = (id, key) => {
            const el = document.getElementById(id);
            el.ontouchstart = (e) => { e.preventDefault(); keys[key] = true; };
            el.ontouchend = (e) => { e.preventDefault(); keys[key] = false; };
        };
        setupBtn('btn-left', 'left'); setupBtn('btn-right', 'right');
        setupBtn('btn-fire', 'fire'); setupBtn('btn-ult', 'ult');

        function loop() { if(gameActive) update(); draw(); requestAnimationFrame(loop); }
    </script>
</body>
</html>
