<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Base Destroyer: Mobile Sprite Edition</title>
    <style>
        body { 
            margin: 0; background: #111; color: #fff; font-family: sans-serif;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
            touch-action: none; /* ป้องกันการเลื่อนหน้าจอเวลาปัดนิ้ว */
        }
        canvas { 
            flex-grow: 1; width: 100%; background: #000; border-bottom: 2px solid #444;
        }
        
        /* แผงควบคุมด้านล่าง (ใหญ่และกดง่าย) */
        #controls {
            height: 120px; background: #222; display: flex; 
            justify-content: space-between; align-items: center; padding: 0 20px;
        }
        .btn-group { display: flex; gap: 15px; }
        button {
            width: 75px; height: 75px; border-radius: 50%; border: 2px solid #0ff;
            background: #333; color: #fff; font-size: 24px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-user-select: none;
        }
        button:active { background: #0ff; color: #000; transform: scale(0.9); }
        .btn-atk { border-color: #f00; }
        .btn-atk:active { background: #f00; }
        
        #start-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h1 style="color:#0ff;">READY?</h1>
        <button style="width: auto; height: auto; padding: 15px 40px; border-radius: 10px;" onclick="startGame()">TAP TO START</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="controls">
        <div class="btn-group">
            <button onpointerdown="keys.left=true" onpointerup="keys.left=false" onpointerleave="keys.left=false">◀</button>
            <button onpointerdown="keys.right=true" onpointerup="keys.right=false" onpointerleave="keys.right=false">▶</button>
        </div>
        <div class="btn-group">
            <button class="btn-atk" onpointerdown="keys.fire=true" onpointerup="keys.fire=false" onpointerleave="keys.fire=false">🔥</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 120; // หักพื้นที่ปุ่มด้านล่าง
        }
        window.addEventListener('resize', resize);
        resize();

        let gameActive = false;
        let p, ai, pBase, aiBase, bullets = [];
        let keys = { left: false, right: false, fire: false };

        function startGame() {
            document.getElementById('start-overlay').style.display = 'none';
            pBase = { x: 20, y: canvas.height - 100, hp: 200, emoji: "🏢" };
            aiBase = { x: canvas.width - 80, y: canvas.height - 100, hp: 200, emoji: "🗼" };
            p = { x: 100, y: canvas.height - 60, speed: 5, cd: 0, emoji: "🚀" };
            ai = { x: canvas.width - 150, y: canvas.height - 60, speed: 2, cd: 0, emoji: "🛸" };
            bullets = [];
            gameActive = true;
            loop();
        }

        function update() {
            // ควบคุม
            if (keys.left && p.x > 80) p.x -= p.speed;
            if (keys.right && p.x < canvas.width - 150) p.x += p.speed;
            
            // ยิง
            if (keys.fire && p.cd <= 0) {
                bullets.push({x: p.x + 30, y: p.y - 15, vx: 10, color: '#0ff', owner: 'p'});
                p.cd = 15;
            }
            if (p.cd > 0) p.cd--;

            // AI ง่ายๆ
            if (ai.x > p.x + 100) ai.x -= ai.speed; else ai.x += ai.speed;
            if (ai.cd <= 0) {
                bullets.push({x: ai.x - 10, y: ai.y - 15, vx: -8, color: '#f00', owner: 'ai'});
                ai.cd = 50;
            }
            if (ai.cd > 0) ai.cd--;

            // กระสุน
            bullets.forEach((b, i) => {
                b.x += b.vx;
                if (b.owner === 'p' && b.x > aiBase.x) { aiBase.hp -= 10; bullets.splice(i, 1); }
                else if (b.owner === 'ai' && b.x < pBase.x + 60) { pBase.hp -= 10; bullets.splice(i, 1); }
                else if (b.x < 0 || b.x > canvas.width) bullets.splice(i, 1);
            });

            if (pBase.hp <= 0 || aiBase.hp <= 0) gameActive = false;
        }

        function draw() {
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // วาดพื้น
            ctx.fillStyle = '#222'; ctx.fillRect(0, canvas.height - 30, canvas.width, 30);

            // วาดด้วย Emoji แทนกล่องสี่เหลี่ยม (Models)
            ctx.font = "60px Arial";
            ctx.fillText(pBase.emoji, pBase.x, pBase.y);
            ctx.fillText(aiBase.emoji, aiBase.x, aiBase.y);
            
            ctx.font = "40px Arial";
            ctx.fillText(p.emoji, p.x, p.y);
            ctx.fillText(ai.emoji, ai.x, ai.y);

            // หลอดเลือด
            ctx.fillStyle = "#0ff"; ctx.fillRect(pBase.x, pBase.y - 30, pBase.hp/2, 5);
            ctx.fillStyle = "#f00"; ctx.fillRect(aiBase.x, aiBase.y - 30, aiBase.hp/2, 5);

            // กระสุน
            bullets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill();
            });

            if (!gameActive && pBase) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = '#fff'; ctx.textAlign = "center";
                ctx.fillText(pBase.hp <= 0 ? "GAME OVER" : "YOU WIN", canvas.width/2, canvas.height/2);
            }
        }

        function loop() {
            if (gameActive) update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
