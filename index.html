<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Base Destroyer: Mobile Fix</title>
    <style>
        body { 
            margin: 0; background: #050505; color: #fff; font-family: sans-serif;
            overflow: hidden; touch-action: none; display: flex; flex-direction: column; align-items: center;
        }
        canvas { 
            background: #000; display: block; max-width: 100vw; max-height: 60vh;
            border-bottom: 2px solid #333;
        }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* ปรับปรุงปุ่มมือถือใหม่หมด */
        #mobile-ui {
            width: 100%; height: 35vh; background: #111;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; box-sizing: border-box; z-index: 1000;
        }
        .control-group { display: flex; gap: 20px; }
        .btn {
            width: 80px; height: 80px; background: #222; border: 3px solid #00ccff;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #fff; user-select: none;
            -webkit-user-select: none; touch-action: none;
        }
        .btn:active { background: #00ccff; color: #000; transform: scale(0.9); }
        .btn-ult { border-color: #ff00ff; color: #ff00ff; }
        
        .boss-mode-text {
            position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
            color: #ff0000; font-size: 30px; font-weight: 900; display: none; z-index: 500;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 style="color:#00ccff">BASE DESTROYER</h1>
        <button id="start-btn" style="padding: 20px 50px; font-size: 24px; background:#00ccff; border:none; border-radius:10px; font-weight:bold;">START GAME</button>
    </div>

    <div id="boss-alert" class="boss-mode-text">⚠️ BOSS DETECTED ⚠️</div>
    <canvas id="gameCanvas" width="900" height="500"></canvas>

    <div id="mobile-ui">
        <div class="control-group">
            <div class="btn" id="btn-left">⬅️</div>
            <div class="btn" id="btn-right">➡️</div>
        </div>
        <div class="control-group">
            <div class="btn btn-ult" id="btn-ult">ULT</div>
            <div class="btn" id="btn-fire">🔥</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');

        let gameActive = false;
        let player, ai, playerBase, aiBase;
        let bullets = [], stars = [], particles = [];
        let keys = { left: false, right: false, fire: false, ult: false };
        let ultCharge = 0;
        let ultActive = 0;

        // --- ระบบ Game Loop ---
        document.getElementById('start-btn').onclick = () => {
            overlay.style.display = 'none';
            resetGame();
            gameActive = true;
            loop();
        };

        function resetGame() {
            playerBase = { x: 50, y: 350, w: 80, hp: 200, maxHp: 200, color: '#00ccff' };
            aiBase = { x: 770, y: 350, w: 80, hp: 400, maxHp: 400, color: '#ff4444' };
            player = { x: 200, y: 435, speed: 6, color: '#00ccff' };
            ai = { x: 700, y: 435, speed: 3, color: '#ff4444', cooldown: 0, isBoss: false };
            bullets = []; particles = []; ultCharge = 0;
            stars = []; for(let i=0; i<50; i++) stars.push({x:Math.random()*900, y:Math.random()*500, s:Math.random()*2});
        }

        // --- ปรับปรุงระบบ Input มือถือ (บังคับอยู่ตรงนี้) ---
        function setupMobileBtn(id, keyName) {
            const btn = document.getElementById(id);
            const startHandler = (e) => { e.preventDefault(); keys[keyName] = true; };
            const endHandler = (e) => { e.preventDefault(); keys[keyName] = false; };
            
            btn.addEventListener('touchstart', startHandler);
            btn.addEventListener('touchend', endHandler);
            btn.addEventListener('mousedown', startHandler); // รองรับการคลิกเมาส์ทดสอบ
            btn.addEventListener('mouseup', endHandler);
        }

        setupMobileBtn('btn-left', 'left');
        setupMobileBtn('btn-right', 'right');
        setupMobileBtn('btn-fire', 'fire');
        setupMobileBtn('btn-ult', 'ult');

        // --- Keyboard Fallback ---
        window.onkeydown = (e) => {
            if(e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
            if(e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
            if(e.code === 'Space') keys.fire = true;
            if(e.code === 'ShiftLeft') keys.ult = true;
        };
        window.onkeyup = (e) => {
            if(e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
            if(e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
            if(e.code === 'Space') keys.fire = false;
            if(e.code === 'ShiftLeft') keys.ult = false;
        };

        function update() {
            // เดิน
            if (keys.left && player.x > 150) player.x -= player.speed;
            if (keys.right && player.x < 750) player.x += player.speed;

            // ยิง
            if (keys.fire && (!player.cooldown || player.cooldown <= 0)) {
                bullets.push({x: player.x + 40, y: player.y, vx: 12, owner: 'p', color: '#0ff'});
                player.cooldown = 20;
            }
            if (player.cooldown > 0) player.cooldown--;

            // อัลติ
            if (keys.ult && ultCharge >= 100) {
                ultActive = 60; ultCharge = 0;
            }
            if (ultCharge < 100) ultCharge += 0.1;

            // กระสุน
            bullets.forEach((b, i) => {
                b.x += b.vx;
                if (b.owner === 'p' && b.x > aiBase.x) {
                    aiBase.hp -= 10; bullets.splice(i, 1);
                } else if (b.owner === 'ai' && b.x < playerBase.x + playerBase.w) {
                    playerBase.hp -= 10; bullets.splice(i, 1);
                } else if (b.x < 0 || b.x > 900) bullets.splice(i, 1);
            });

            // AI ง่ายๆ
            if(ai.x > player.x + 150) ai.x -= ai.speed;
            else ai.x += ai.speed;
            if(ai.cooldown <= 0) {
                bullets.push({x: ai.x, y: ai.y, vx: -8, owner: 'ai', color: '#f00'});
                ai.cooldown = 60;
            }
            ai.cooldown--;

            if (playerBase.hp <= 0 || aiBase.hp <= 0) gameActive = false;
        }

        function draw() {
            ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, 900, 500);
            
            // พื้นหลังดาว
            ctx.fillStyle = '#fff'; stars.forEach(s => ctx.fillRect(s.x, s.y, s.s, s.s));

            // ฐาน
            ctx.fillStyle = playerBase.color; ctx.fillRect(playerBase.x, playerBase.y, playerBase.w, 80);
            ctx.fillStyle = aiBase.color; ctx.fillRect(aiBase.x, aiBase.y, aiBase.w, 80);

            // หลอดเลือด
            ctx.fillStyle = '#f00';
            ctx.fillRect(playerBase.x, 330, (playerBase.hp/playerBase.maxHp)*playerBase.w, 5);
            ctx.fillRect(aiBase.x, 330, (aiBase.hp/aiBase.maxHp)*aiBase.w, 5);

            // รถถัง
            ctx.fillStyle = player.color; ctx.fillRect(player.x, player.y, 40, 20);
            ctx.fillStyle = ai.color; ctx.fillRect(ai.x, ai.y, 40, 20);

            // กระสุน
            bullets.forEach(b => {
                ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill();
            });

            // เลเซอร์อัลติ
            if (ultActive > 0) {
                ctx.fillStyle = '#fff'; ctx.fillRect(player.x+40, player.y, 900, 10);
                ultActive--; aiBase.hp -= 1;
            }

            // UI อัลติ
            ctx.fillStyle = '#333'; ctx.fillRect(20, 20, 150, 10);
            ctx.fillStyle = ultCharge >= 100 ? '#ff00ff' : '#00ccff';
            ctx.fillRect(20, 20, ultCharge * 1.5, 10);

            if(!gameActive && playerBase) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,0,900,500);
                ctx.fillStyle = '#fff'; ctx.font = "40px Arial"; ctx.textAlign="center";
                ctx.fillText(playerBase.hp <= 0 ? "DEFEAT" : "VICTORY", 450, 250);
            }
        }

        function loop() { if(gameActive) update(); draw(); requestAnimationFrame(loop); }
    </script>
</body>
</html>
