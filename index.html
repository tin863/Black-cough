<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Haven Mobile</title>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; }
        
        /* UI ส่วนบน */
        #ui-top {
            position: absolute; top: 0; width: 100%; display: flex; justify-content: space-around;
            padding: 10px; background: rgba(0,0,0,0.6); font-size: 14px; z-index: 100;
        }
        .stat { color: #ffeb3b; }

        /* ปุ่มควบคุมมือถือ */
        #controls {
            position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 100;
        }
        .btn {
            width: 70px; height: 70px; background: rgba(255,255,255,0.2); border: 2px solid #fff;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold; color: #fff; user-select: none;
        }
        .btn:active { background: rgba(255,255,255,0.5); }

        /* จอยสติ๊ก */
        #joystick-base {
            position: absolute; bottom: 40px; left: 40px; width: 100px; height: 100px;
            background: rgba(255,255,255,0.1); border-radius: 50%; z-index: 100; border: 1px solid rgba(255,255,255,0.3);
        }
        #joystick-stick {
            position: absolute; top: 25px; left: 25px; width: 50px; height: 50px;
            background: #fff; border-radius: 50%; opacity: 0.5;
        }

        canvas { background: #2e4d2e; display: block; }
    </style>
</head>
<body>

    <div id="ui-top">
        <div>🪵 <span id="wood-val" class="stat">0</span></div>
        <div>🍎 <span id="food-val" class="stat">0</span></div>
        <div>👥 <span id="pop-val" class="stat">1</span></div>
        <div id="time-val">☀️ กลางวัน</div>
    </div>

    <div id="joystick-base">
        <div id="joystick-stick"></div>
    </div>

    <div id="controls">
        <div class="btn" id="btn-house">สร้างบ้าน<br>(30)</div>
        <div class="btn" id="btn-wall">สร้างกำแพง<br>(10)</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // --- Game Logic Variables ---
        let world = { width: 2000, height: 2000 };
        let camera = { x: 0, y: 0 };
        let resources = { wood: 50, food: 20 };
        let isNight = false;
        let dayTime = 0;
        
        let player = { x: 1000, y: 1000, size: 20, speed: 5, hp: 100 };
        let survivors = [], zombies = [], entities = [], buildings = [];

        // --- Joystick Logic ---
        let stick = document.getElementById('joystick-stick');
        let stickData = { x: 0, y: 0, active: false };

        window.addEventListener('touchstart', e => {
            let touch = e.touches[0];
            let base = document.getElementById('joystick-base').getBoundingClientRect();
            let dist = Math.hypot(touch.clientX - (base.left + 50), touch.clientY - (base.top + 50));
            if(dist < 60) stickData.active = true;
        });

        window.addEventListener('touchmove', e => {
            if(!stickData.active) return;
            let touch = e.touches[0];
            let base = document.getElementById('joystick-base').getBoundingClientRect();
            let centerX = base.left + 50;
            let centerY = base.top + 50;
            
            let angle = Math.atan2(touch.clientY - centerY, touch.clientX - centerX);
            let dist = Math.min(50, Math.hypot(touch.clientX - centerX, touch.clientY - centerY));
            
            stickData.x = Math.cos(angle) * (dist / 50);
            stickData.y = Math.sin(angle) * (dist / 50);
            
            stick.style.transform = `translate(${stickData.x * 40}px, ${stickData.y * 40}px)`;
        });

        window.addEventListener('touchend', () => {
            stickData.active = false;
            stickData.x = 0; stickData.y = 0;
            stick.style.transform = `translate(0px, 0px)`;
        });

        // --- ปุ่มกดสร้างบ้าน ---
        document.getElementById('btn-house').onclick = () => tryBuild('house');
        document.getElementById('btn-wall').onclick = () => tryBuild('wall');

        function tryBuild(type) {
            let cost = type === 'house' ? 30 : 10;
            if(resources.wood >= cost) {
                resources.wood -= cost;
                buildings.push({ x: player.x - 25, y: player.y - 25, w: 50, h: 50, type: type });
            }
        }

        // --- Game Functions ---
        function spawnEntity(type) {
            entities.push({
                x: Math.random() * world.width, y: Math.random() * world.height,
                type: type, size: type === 'tree' ? 20 : 10, hp: 100, id: Math.random()
            });
        }

        function init() {
            for(let i=0; i<40; i++) spawnEntity('tree');
            for(let i=0; i<20; i++) spawnEntity('food');
            for(let i=0; i<5; i++) spawnEntity('survivor');
            requestAnimationFrame(gameLoop);
        }

        function update() {
            // เดินตามจอยสติ๊ก
            player.x += stickData.x * player.speed;
            player.y += stickData.y * player.speed;

            // กล้อง
            camera.x = player.x - canvas.width/2;
            camera.y = player.y - canvas.height/2;

            // เวลาและซอมบี้
            dayTime++;
            if(dayTime > 2000) { dayTime = 0; isNight = !isNight; }
            document.getElementById('time-val').innerText = isNight ? "🌙 กลางคืน" : "☀️ กลางวัน";
            if(isNight && Math.random() < 0.02) {
                zombies.push({x: Math.random()*2000, y: Math.random()*2000, hp: 50});
            }

            // NPC AI (เก็บของ)
            survivors.forEach(s => {
                let target = null;
                entities.forEach(ent => {
                    if((ent.type === 'tree' || ent.type === 'food') && Math.hypot(ent.x - s.x, ent.y - s.y) < 200) target = ent;
                });

                if(target) {
                    let angle = Math.atan2(target.y - s.y, target.x - s.x);
                    s.x += Math.cos(angle) * 2; s.y += Math.sin(angle) * 2;
                    if(Math.hypot(target.x - s.x, target.y - s.y) < 20) {
                        if(target.type === 'food') resources.food += 2;
                        else resources.wood += 0.2;
                    }
                } else {
                    let angle = Math.atan2(player.y - s.y, player.x - s.x);
                    if(Math.hypot(player.x - s.x, player.y - s.y) > 50) {
                        s.x += Math.cos(angle) * 3; s.y += Math.sin(angle) * 3;
                    }
                }
            });

            // ช่วยคน
            entities.forEach((ent, i) => {
                if(ent.type === 'survivor' && Math.hypot(player.x - ent.x, player.y - ent.y) < 40) {
                    survivors.push({x: ent.x, y: ent.y});
                    entities.splice(i, 1);
                }
            });

            // UI
            document.getElementById('wood-val').innerText = Math.floor(resources.wood);
            document.getElementById('food-val').innerText = Math.floor(resources.food);
            document.getElementById('pop-val').innerText = survivors.length + 1;
        }

        function draw() {
            ctx.setTransform(1,0,0,1,0,0);
            ctx.clearRect(0,0, canvas.width, canvas.height);
            ctx.translate(-camera.x, -camera.y);

            // วาดตารางพื้น
            ctx.strokeStyle = "rgba(255,255,255,0.05)";
            for(let i=0; i<2000; i+=100) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 2000); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(2000, i); ctx.stroke();
            }

            // วาดสิ่งของ
            entities.forEach(ent => {
                ctx.fillStyle = ent.type === 'tree' ? '#2e7d32' : (ent.type === 'food' ? '#f44336' : '#fff');
                ctx.beginPath(); ctx.arc(ent.x, ent.y, ent.size, 0, Math.PI*2); ctx.fill();
            });

            // วาดบ้าน
            buildings.forEach(b => {
                ctx.fillStyle = b.type === 'house' ? '#795548' : '#555';
                ctx.fillRect(b.x, b.y, b.w, b.h);
            });

            // วาดตัวละคร
            ctx.fillStyle = '#2196F3';
            ctx.beginPath(); ctx.arc(player.x, player.y, player.size, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = '#fff';
            survivors.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, 10, 0, Math.PI*2); ctx.fill(); });

            // วาดซอมบี้
            ctx.fillStyle = '#4caf50';
            zombies.forEach(z => { ctx.beginPath(); ctx.arc(z.x, z.y, 12, 0, Math.PI*2); ctx.fill(); });

            // ฟิลเตอร์กลางคืน
            if(isNight) {
                ctx.setTransform(1,0,0,1,0,0);
                ctx.fillStyle = "rgba(0,0,50,0.3)";
                ctx.fillRect(0,0, canvas.width, canvas.height);
            }
        }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        init();
    </script>
</body>
</html>
